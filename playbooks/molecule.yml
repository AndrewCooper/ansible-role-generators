#!/usr/bin/env -S ansible-playbook
# SPDX-License-Identifier: Apache-2.0
---
# Template playbook — copy and customize for your environment.
# Set role_vars_dir to a directory containing common.yml and optional
# per-role <gen_role_name>.yml files to inject site-specific defaults.
# gen_molecule_scenarios defaults to ["default"]; override in common.yml.

- name: Generate Molecule test scenarios for an Ansible role
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    role_vars_dir: role_vars
  vars_prompt:
    - name: gen_role_name
      prompt: "Enter the role name to add Molecule scenarios to (e.g., my_service)"
      private: false

  tasks:
    - name: Include common variables
      ansible.builtin.include_vars:
        file: "{{ role_vars_dir }}/common.yml"

    - name: Include role-specific variables if present
      ansible.builtin.include_vars:
        file: "{{ role_vars_dir }}/{{ gen_role_name }}.yml"
      when: lookup('ansible.builtin.fileglob', role_vars_dir + '/' + gen_role_name + '.yml') | length > 0

    - name: Generate Molecule scenarios
      ansible.builtin.include_role:
        name: molecule
