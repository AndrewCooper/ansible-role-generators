---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/artifacts/roles/test_service"
  tasks:
    - name: Check generated role structure
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _stat
      loop:
        - "{{ _role_dir }}/defaults/main/image_source.yml"
        - "{{ _role_dir }}/tasks/source_sync.yml"
      loop_control:
        label: "{{ item | basename }}"

    - name: Assert all expected files exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Expected file not found: {{ item.item }}"
      loop: "{{ _stat.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Read generated image source defaults
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/defaults/main/image_source.yml"
      register: _defaults

    - name: Assert image source defaults are present
      vars:
        _text: "{{ _defaults.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'test_service_source_dir' in _text"
          - "'test_service_source_path' in _text"
