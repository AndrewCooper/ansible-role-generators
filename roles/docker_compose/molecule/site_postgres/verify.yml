---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/artifacts/roles/test_service"
  tasks:
    - name: Read generated defaults
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/defaults/main/main.yml"
      register: _defaults

    - name: Assert postgres secret is present in defaults
      vars:
        _text: "{{ _defaults.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'database__passwd' in _text"
          - "'postgres_roles' in _text"
