---
- name: Converge
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gen_role_name: test_service
    gen_dest_dir: "{{ playbook_dir }}/artifacts"
    gen_role_overlays:
      - site_postgres
  tasks:
    - name: Run docker_compose generator
      ansible.builtin.include_role:
        name: docker_compose
