---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/artifacts/roles/test_service"
  tasks:
    - name: Read generated defaults
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/defaults/main/main.yml"
      register: _defaults

    - name: Assert traefik networks are present in defaults
      vars:
        _text: "{{ _defaults.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'traefik' in _text"
          - "'backend' in _text"
          - "'traefik_network_frontend' in _text"

    - name: Read generated app service defaults
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/defaults/main/app.yml"
      register: _app_defaults

    - name: Assert traefik networks and labels are present in app service defaults
      vars:
        _text: "{{ _app_defaults.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'traefik' in _text"
          - "'backend' in _text"
